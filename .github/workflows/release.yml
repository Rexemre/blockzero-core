# Release Block Zero CLI binaries (mainnet + testnet mining)

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUILD_FLAGS: >-
    -DBUILD_GUI=ON
    -DENABLE_IPC=OFF
    -DBUILD_TESTS=OFF
    -DENABLE_WALLET=ON
    -DCMAKE_CXX_STANDARD=20

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 \
            libevent-dev libboost-dev libsqlite3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqrencode-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -B build ${{ env.BUILD_FLAGS }}
          cmake --build build -j"$(nproc)" --target bitcoind bitcoin-cli bitcoin-qt bz-genesis-miner

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="blockzero-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "${PKG}/bin"
          cp build/bin/bitcoind build/bin/bitcoin-cli build/bin/bz-genesis-miner "${PKG}/bin/"
          # GUI wallet ships as "block-zero" (terminal-friendly; same Block Zero
          # branding compiled in). bitcoind/bitcoin-cli keep their names for scripts.
          cp build/bin/bitcoin-qt "${PKG}/bin/block-zero"
          cp contrib/mainnet/bitcoin.conf.example "${PKG}/bitcoin.conf.example"
          cp contrib/testnet/bitcoin.conf.example "${PKG}/bitcoin.conf.testnet.example"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            blockzero-*-linux-${{ matrix.arch }}.tar.gz
            blockzero-*-linux-${{ matrix.arch }}.tar.gz.sha256

  macos:
    # Apple Silicon only. The macos-13 (Intel) runners are scarce and routinely
    # sat queued for hours, dragging the whole release to the 24h cap without
    # ever publishing an x64 artifact. Intel Mac users can build from source.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake boost libevent pkg-config qt@6 qrencode

      - name: Build
        run: |
          cmake -B build ${{ env.BUILD_FLAGS }} \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          cmake --build build -j"$(sysctl -n hw.ncpu)" --target bitcoind bitcoin-cli bitcoin-qt bz-genesis-miner

      - name: Package
        env:
          # Optional — set these repo secrets to ship a fully notarized wallet
          # that opens with a double-click (no "damaged"/"unidentified developer"
          # prompt). If unset, the app is ad-hoc signed: it still runs (no longer
          # "damaged"), but first launch needs right-click -> Open once.
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="blockzero-${TAG}-macos-${{ matrix.arch }}"
          # CFBundleShortVersionString must be numeric X.Y.Z (strip leading v / -rcNN).
          VER="$(printf '%s' "${TAG#v}" | sed -E 's/-.*$//')"
          [ -n "$VER" ] || VER="1.0.0"
          mkdir -p "${PKG}/bin"
          cp build/bin/bitcoind build/bin/bitcoin-cli build/bin/bz-genesis-miner "${PKG}/bin/"

          # --- Build a branded, self-contained "Block Zero.app" (parity with the
          #     Windows bitcoin-qt.exe: same GUI, Block Zero icon + identity). ---
          APP="${PKG}/Block Zero.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources/Base.lproj"
          cp build/bin/bitcoin-qt "${APP}/Contents/MacOS/Block Zero"

          # App icon (.icns) from the Block Zero PNG using native macOS tools.
          ICONSET="$(mktemp -d)/bloz.iconset"
          mkdir -p "$ICONSET"
          SRC_PNG="src/qt/res/icons/bitcoin.png"   # 1024px Block Zero logo
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC_PNG" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d "$SRC_PNG" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "${APP}/Contents/Resources/bloz.icns"

          printf 'APPL????' > "${APP}/Contents/PkgInfo"
          printf '{ CFBundleDisplayName = "Block Zero"; CFBundleName = "Block Zero"; }\n' \
            > "${APP}/Contents/Resources/Base.lproj/InfoPlist.strings"

          cat > "${APP}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>LSMinimumSystemVersion</key><string>14</string>
            <key>LSArchitecturePriority</key><array><string>arm64</string></array>
            <key>CFBundleIconFile</key><string>bloz.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleSupportedPlatforms</key><array><string>MacOSX</string></array>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleSignature</key><string>????</string>
            <key>CFBundleExecutable</key><string>Block Zero</string>
            <key>CFBundleName</key><string>Block Zero</string>
            <key>LSHasLocalizedDisplayName</key><true/>
            <key>CFBundleIdentifier</key><string>org.blockzero.BlockZero</string>
            <key>CFBundleURLTypes</key><array><dict>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>CFBundleURLName</key><string>org.blockzero.BlozPayment</string>
              <key>CFBundleURLSchemes</key><array><string>bloz</string></array>
            </dict></array>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.finance</string>
          </dict>
          </plist>
          EOF

          # Bundle the Qt frameworks so the .app runs without Homebrew installed.
          "$(brew --prefix qt@6)/bin/macdeployqt" "${APP}"

          # --- Code-sign (CRITICAL) ---------------------------------------------
          # macdeployqt rewrites the binary's load paths (install_name_tool), which
          # INVALIDATES the build-time signature. On Apple Silicon an arm64 app with
          # a broken/absent signature is killed by the kernel and Gatekeeper reports
          # "is damaged and can't be opened. Move it to the Bin." We must re-sign the
          # whole bundle here so it actually runs.
          ENT="$(mktemp).plist"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST

          if [ -n "${MACOS_CERT_P12:-}" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            # Developer ID signing -> enables notarization (double-click "just works").
            KEYCHAIN="$RUNNER_TEMP/bloz-sign.keychain-db"
            KPW="$(openssl rand -base64 24)"
            security create-keychain -p "$KPW" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KPW" "$KEYCHAIN"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
            SIGN_ID="$MACOS_SIGN_IDENTITY"
            HARDENED="--options runtime --timestamp"
          else
            echo "::warning::No MACOS_CERT_P12/MACOS_SIGN_IDENTITY secrets — using ad-hoc signature. App will run (no longer 'damaged'), but first launch still needs right-click -> Open. Add Developer ID + App Store Connect secrets to ship a notarized, double-click build."
            SIGN_ID="-"
            HARDENED=""
          fi

          # Sign inside-out: nested dylibs/frameworks first, then the app bundle.
          find "${APP}/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -u+x \) -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                codesign --force $HARDENED --entitlements "$ENT" --sign "$SIGN_ID" "$f" || true
              done
          codesign --force --deep $HARDENED --entitlements "$ENT" --sign "$SIGN_ID" "${APP}/Contents/MacOS/Block Zero"
          codesign --force --deep $HARDENED --entitlements "$ENT" --sign "$SIGN_ID" "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

          # --- Notarize + staple (only with Developer ID + API key secrets) ------
          if [ "$SIGN_ID" != "-" ] && [ -n "${AC_API_KEY_P8:-}" ] && [ -n "${AC_API_KEY_ID:-}" ] && [ -n "${AC_API_ISSUER_ID:-}" ]; then
            echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
            ditto -c -k --keepParent "${APP}" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/ac_key.p8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
            xcrun stapler staple "${APP}"
            echo "Notarized and stapled — wallet will open with a double-click."
          fi

          cp contrib/mainnet/bitcoin.conf.example "${PKG}/bitcoin.conf.example"
          cp contrib/testnet/bitcoin.conf.example "${PKG}/bitcoin.conf.testnet.example"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            blockzero-*-macos-*.tar.gz
            blockzero-*-macos-*.tar.gz.sha256

  windows-x64:
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      PYTHONUTF8: 1
      QT_VERSION: "6.8.3"
      QT_ARCH: "win64_msvc2022_64"
      QT_PATH: "msvc2022_64"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable vcpkg GHA binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Import Visual Studio env vars
        run: py -3 .github/ci-windows.py standard github_import_vs_env

      - name: Install Qt (prebuilt, avoids vcpkg qttools OOM)
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -O qt --archives qtbase qttools qtsvg
          $qtRoot = Join-Path $PWD "qt\$($env:QT_VERSION)\$($env:QT_PATH)"
          echo "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          echo "Qt6_DIR=$qtRoot\lib\cmake\Qt6" >> $env:GITHUB_ENV
          echo "$qtRoot\bin" >> $env:GITHUB_PATH

      - name: Configure vcpkg
        shell: bash
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows.cmake"
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      - name: Generate build system
        run: |
          cmake -B build --preset vs2026 `
            -DBUILD_GUI=ON `
            -DENABLE_IPC=OFF `
            -DBUILD_TESTS=OFF `
            -DENABLE_WALLET=ON `
            -DWITH_ZMQ=OFF `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            -DVCPKG_MANIFEST_FEATURES="wallet;qrencode" `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS --target bitcoind bitcoin-cli bitcoin-qt bz-genesis-miner

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="blockzero-${TAG}-windows-x64"
          QT_BIN="qt/${QT_VERSION}/${QT_PATH}/bin"
          mkdir -p "${PKG}/bin"
          cp build/bin/Release/bitcoind.exe build/bin/Release/bitcoin-cli.exe build/bin/Release/bz-genesis-miner.exe "${PKG}/bin/"
          # GUI wallet ships under the Block Zero name (parity with macOS "Block Zero.app").
          # The icon and "Block Zero" product info are compiled into the exe, so the
          # file name is purely cosmetic. bitcoind/bitcoin-cli keep their names for scripts.
          cp "build/bin/Release/bitcoin-qt.exe" "${PKG}/bin/Block Zero.exe"
          # Deploy the COMPLETE Qt runtime (all required Qt6*.dll + the platforms/
          # styles/imageformats plugins) with windeployqt. The previous hand-picked
          # DLL list missed dependencies and produced "Qt6Gui.dll not found" /
          # blank-launch errors on user machines.
          "${QT_BIN}/windeployqt.exe" --release --no-translations --compiler-runtime \
            --dir "${PKG}/bin" "${PKG}/bin/Block Zero.exe"
          # Non-Qt runtime libraries from vcpkg (libevent, sqlite3, ...).
          cp build/vcpkg_installed/x64-windows/bin/*.dll "${PKG}/bin/" 2>/dev/null || true
          # Bundle MSVC runtime so users without VC++ Redistributable can run the wallet.
          MSVC_CRIT=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/Redist/MSVC/*/x64/Microsoft.VC*.CRT/msvcp140.dll" 2>/dev/null | sort | tail -1)
          if [ -z "${MSVC_CRIT}" ]; then
            echo "MSVC CRT redist not found on runner" >&2
            exit 1
          fi
          MSVC_DIR=$(dirname "${MSVC_CRIT}")
          cp "${MSVC_DIR}"/*.dll "${PKG}/bin/"
          echo "Bundled MSVC runtime from ${MSVC_DIR}"
          cp contrib/mainnet/bitcoin.conf.example "${PKG}/bitcoin.conf.example"
          cp contrib/testnet/bitcoin.conf.example "${PKG}/bitcoin.conf.testnet.example"
          # Loud "extract first" readme + a foolproof launcher. The #1 Windows
          # support issue is users running Block Zero.exe straight from inside the
          # zip: Windows extracts only the .exe to a temp dir without its Qt DLLs,
          # so it dies with "Qt6Widgets.dll not found" (a modal System Error that
          # can need a reboot). The launcher only works once extracted.
          cat > "${PKG}/READ ME FIRST.txt" <<'TXT'
          ============================================================
            BLOCK ZERO WALLET (Windows) - READ THIS FIRST
          ============================================================

          1) EXTRACT this zip first.  Right-click the .zip -> "Extract All...".
             Do NOT run the wallet from inside the zip - Windows launches the
             .exe without its Qt DLLs and you get errors such as
             "Qt6Widgets.dll was not found" (a System Error you may have to
             reboot to clear).

          2) After extracting, double-click  "Start Block Zero.bat"
             (or open the  bin  folder and run  "Block Zero.exe").

          No separate VC++ install needed - all runtime DLLs are in bin\.

          Mining guide:
          https://github.com/Rexemre/blockzero-docs/blob/main/quickstart-mining.md
          TXT
          cat > "${PKG}/Start Block Zero.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          if not exist "bin\Block Zero.exe" (
            echo.
            echo   Block Zero wallet files were not found next to this launcher.
            echo   Please EXTRACT the whole zip first, then run this file again.
            echo.
            pause
            exit /b 1
          )
          start "" "%~dp0bin\Block Zero.exe"
          BAT
          # Batch files want CRLF line endings.
          sed -i 's/$/\r/' "${PKG}/Start Block Zero.bat"
          powershell -Command "Compress-Archive -Path '${PKG}' -DestinationPath '${PKG}.zip' -Force"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build one-click installer
        run: |
          $TAG = "${env:GITHUB_REF_NAME}"
          $PKG = "blockzero-$TAG-windows-x64"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$PWD\$PKG\bin" "/DAppVersion=$TAG" "/F$PKG-setup" "/O$PWD" "contrib\windows\block-zero.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $h = (Get-FileHash "$PKG-setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  $PKG-setup.exe" | Out-File "$PKG-setup.exe.sha256" -Encoding ascii -NoNewline
          # Version-less alias so websites can hard-link a stable "always latest"
          # URL: releases/latest/download/blockzero-windows-x64-setup.exe
          Copy-Item "$PKG-setup.exe" "blockzero-windows-x64-setup.exe" -Force
          $h2 = (Get-FileHash "blockzero-windows-x64-setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$h2  blockzero-windows-x64-setup.exe" | Out-File "blockzero-windows-x64-setup.exe.sha256" -Encoding ascii -NoNewline

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            blockzero-*-windows-x64.zip
            blockzero-*-windows-x64.zip.sha256
            blockzero-*-windows-x64-setup.exe
            blockzero-*-windows-x64-setup.exe.sha256
            blockzero-windows-x64-setup.exe
            blockzero-windows-x64-setup.exe.sha256

  # Fast CLI-only Windows build: no Qt/GUI, so vcpkg does NOT compile Qt from
  # source (which makes the full GUI job take ~90 min). Publishes the mining
  # binaries (bitcoind, bitcoin-cli, bz-genesis-miner) in ~10-15 min.
  windows-x64-cli:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable vcpkg GHA binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Import Visual Studio env vars
        run: py -3 .github/ci-windows.py standard github_import_vs_env

      - name: Configure vcpkg
        shell: bash
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows-static.cmake"
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      - name: Generate build system (no GUI)
        run: |
          cmake -B build --preset vs2026-static `
            -DBUILD_GUI=OFF `
            -DENABLE_IPC=OFF `
            -DBUILD_TESTS=OFF `
            -DENABLE_WALLET=ON `
            -DWITH_ZMQ=OFF `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            -DVCPKG_MANIFEST_FEATURES="wallet"

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS --target bitcoind bitcoin-cli bz-genesis-miner

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="blockzero-${TAG}-windows-x64-cli"
          mkdir -p "${PKG}/bin"
          cp build/bin/Release/bitcoind.exe build/bin/Release/bitcoin-cli.exe build/bin/Release/bz-genesis-miner.exe "${PKG}/bin/"
          cp contrib/mainnet/bitcoin.conf.example "${PKG}/bitcoin.conf.example"
          cp contrib/testnet/bitcoin.conf.example "${PKG}/bitcoin.conf.testnet.example"
          powershell -Command "Compress-Archive -Path '${PKG}' -DestinationPath '${PKG}.zip' -Force"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            blockzero-*-windows-x64-cli.zip
            blockzero-*-windows-x64-cli.zip.sha256
